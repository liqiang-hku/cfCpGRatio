[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfCpGRatio"
version = "0.1.0"
description = "Direct CpG-level quantification for cfDNA tissue-of-origin analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.scripts]
cfCpGRatio = "cfcpgratio:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cfcpgratio"]
